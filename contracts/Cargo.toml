[workspace]
resolver = "2"
members = ["vigil-interface", "vigil-registry", "vigil-guard"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[workspace.dependencies]
soroban-sdk = "28.0.0"
stellar-accounts = "0.8.0"
vigil-interface = { path = "vigil-interface" }
vigil-registry = { path = "vigil-registry" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# `stellar contract build` uses this profile when present.
[profile.release-with-logs]
inherits = "release"
debug-assertions = true
